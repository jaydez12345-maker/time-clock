<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="M&E Sales">
<meta name="theme-color" content="#0B5C8E">
<link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0AgMAAABAo+6hAAAACVBMVEX////1yDILXI6oEuFZAAAAwUlEQVR42u3ZQQrCMBCF4UzNAbLxPrmEPWPRS+RIOUAkrgpVUHiLX0Redy0fj2GaNlMa1yQcS7K2tra2/n+dn0/XtGxUdkqn28uFc1WyK9eTAPudJV3ASqqiA1yDGcwukq5cJQE+xVnSBaykKjrAN1sGs4ukO1jJALOnlt3AVdUlPcBKJrkXN0l3sJIBZk8tu4E7YJf0ACuZ5ITXPk1h94tnZGtra2tra2tr63df7Id/R+uesLmDv3d33BNra+vv6QcUcRe/x7rU7wAAAABJRU5ErkJggg==">
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0AgMAAABAo+6hAAAACVBMVEX////1yDILXI6oEuFZAAAAwUlEQVR42u3ZQQrCMBCF4UzNAbLxPrmEPWPRS+RIOUAkrgpVUHiLX0Redy0fj2GaNlMa1yQcS7K2tra2/n+dn0/XtGxUdkqn28uFc1WyK9eTAPudJV3ASqqiA1yDGcwukq5cJQE+xVnSBaykKjrAN1sGs4ukO1jJALOnlt3AVdUlPcBKJrkXN0l3sJIBZk8tu4E7YJf0ACuZ5ITXPk1h94tnZGtra2tra2tr63df7Id/R+uesLmDv3d33BNra+vv6QcUcRe/x7rU7wAAAABJRU5ErkJggg==">
<title>M&amp;E Sales Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EAE8; --card:#FFFFFF; --ink:#16212B; --muted:#56626B; --line:#CDD4D1;
  --blue:#0B5C8E; --blue-ink:#FFFFFF;
  --red:#C8252F; --yellow:#E8B400; --yellow-ink:#7E6100; --green:#2C8440;
  --red-bg:#FBE9EA; --yellow-bg:#FFF5D1; --green-bg:#E4F2E7; --blue-bg:#E1EEF6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10171D; --card:#1A242C; --ink:#E8EDF0; --muted:#9AA7B0; --line:#2C3943;
    --blue:#4AA3DB; --blue-ink:#06121B;
    --red:#F0646D; --yellow:#F5C832; --yellow-ink:#F5C832; --green:#5DC476;
    --red-bg:#3A1D21; --yellow-bg:#383015; --green-bg:#17331F; --blue-bg:#15303F;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;margin:0;line-height:1.1}
p{margin:0}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.muted,.meta{color:var(--muted)}
.meta{font-size:14px;display:block}

/* Shell */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{font:600 14px 'Barlow',sans-serif;color:var(--muted)}
header.top h1{font-size:32px;font-weight:700}
.offline{background:var(--yellow-bg);color:var(--yellow-ink);font-weight:600;font-size:14px;padding:6px 16px;text-align:center}
.icon-btn{background:none;border:0;color:var(--ink);width:44px;height:44px;display:grid;place-items:center;border-radius:10px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:9px 0 8px;font:600 14px 'Barlow Condensed',sans-serif;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;cursor:pointer}
nav.tabs button[aria-current="true"]{color:var(--blue)}
nav.tabs svg{width:24px;height:24px}
.badge{position:absolute;top:4px;left:calc(50% + 5px);background:var(--red);color:#fff;font:600 12px/18px 'Barlow',sans-serif;min-width:18px;height:18px;border-radius:9px;padding:0 5px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Buttons & inputs */
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px 'Barlow',sans-serif;padding:9px 14px;border-radius:8px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.good{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn.danger{color:var(--red);border-color:var(--red);background:transparent}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
label.f{display:block;margin-bottom:12px;font-size:14px;font-weight:500;color:var(--muted)}
input,select,textarea{display:block;width:100%;margin-top:4px;font:16px 'Barlow',sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Sections */
.sec{margin-bottom:26px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-head h2{font-size:24px;font-weight:700}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:22px 18px}
.empty h2{font-size:24px;margin-bottom:6px}
.empty p{color:var(--muted);margin-bottom:14px}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--muted)}

/* One-call groups: marking-flag strip + countdown */
.grp{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.grp-head{display:grid;grid-template-columns:10px 1fr auto;gap:12px;padding:14px 14px 10px 0;align-items:center}
.flag{align-self:stretch;background:var(--green);border-radius:0 3px 3px 0}
.s-due .flag{background:var(--yellow)}
.s-expired .flag{background:var(--red)}
.grp-head h3{font-size:24px;font-weight:700;letter-spacing:.01em}
.count{font:700 46px/.85 'Barlow Condensed',sans-serif;text-align:right;color:var(--green);min-width:64px}
.count small{display:block;font:500 13px/1.3 'Barlow',sans-serif;color:var(--muted);margin-top:4px}
.s-due .count{color:var(--yellow-ink)}
.s-expired .count{color:var(--red)}
.status{font-weight:600;font-size:14px;display:inline-block;padding:1px 8px;border-radius:4px;margin:3px 0}
.s-ok .status{background:var(--green-bg);color:var(--green)}
.s-due .status{background:var(--yellow-bg);color:var(--yellow-ink)}
.s-expired .status{background:var(--red-bg);color:var(--red)}
.grp-acts{display:flex;gap:8px;padding:0 14px 12px 22px;flex-wrap:wrap}
.tk{display:grid;grid-template-columns:1fr auto;gap:0 10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 14px 10px 22px;color:var(--ink);font:inherit;cursor:pointer}
.tk-title{font-weight:600}
.tk-num{font:600 19px 'Barlow Condensed',sans-serif;letter-spacing:.03em;text-align:right}

/* Today rows */
.trow{display:grid;grid-template-columns:8px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 0;margin-bottom:8px;color:var(--ink);font:inherit;cursor:pointer;overflow:hidden}
.trow .count{font-size:36px;min-width:48px}

/* Lists */
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.row.is-done{opacity:.6}
.row-main{display:block;width:100%;text-align:left;background:none;border:0;padding:0;color:var(--ink);font:inherit;cursor:pointer}
.row-main strong{font-size:17px}
.row .btn-row{margin-top:10px}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:1px 8px;border-radius:4px;background:var(--bg);color:var(--muted);margin:2px 4px 2px 0}
.pill.done,.pill.won,.pill.yes{background:var(--green-bg);color:var(--green)}
.pill.late,.pill.lost{background:var(--red-bg);color:var(--red)}
.pill.quoted,.pill.stale{background:var(--yellow-bg);color:var(--yellow-ink)}
.pill.lead{background:var(--blue-bg);color:var(--blue)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 13px;font:500 14px 'Barlow',sans-serif;white-space:nowrap;min-height:36px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 12px}
.prog i{display:block;height:100%;background:var(--green)}
.big-num{font:700 40px/1 'Barlow Condensed',sans-serif}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.log{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
.log p{padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.day-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 8px}
.day-h h2{font-size:22px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,20,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
.sheet h2{font-size:26px;margin-bottom:12px}
.sheet h3{font-size:20px;margin:16px 0 8px}
.sheet-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.sheet-acts .spacer{flex:1}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;font-weight:500;max-width:92%;text-align:center}

/* Login */
.login{max-width:380px;margin:0 auto;padding:calc(60px + env(safe-area-inset-top,0px)) 20px 40px}
.login h1{font-size:44px;font-weight:700;margin:6px 0 20px}
.err{color:var(--red);font-weight:500;margin:8px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast-root"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============================================================
   PASTE YOUR FIREBASE CONFIG HERE
   (Firebase console > Project settings > Your apps > Config)
   Use the same config as your time clock app.
   ============================================================ */
const firebaseConfig = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_AUTH_DOMAIN",
  projectId: "PASTE_PROJECT_ID",
  storageBucket: "PASTE_STORAGE_BUCKET",
  messagingSenderId: "PASTE_SENDER_ID",
  appId: "PASTE_APP_ID"
};

const ROOT = "salesHub"; // all data lives under salesHub/{your user id}/...
const DAY = 864e5;
const DEFAULT_TEMPLATES = {
  checkin: "Hey {first}, it's {me} with M&E Hydrovac. Do you need a hydrovac, vac truck, or roll-off for tomorrow?",
  intro: "Hi {first}, this is {me} with M&E Hydrovac and Oilfield Services in Midland. We run hydrovac excavation, vac trucks, and roll-offs (open tops and vac boxes). Can I send you our rates?",
  quote: "Hi {first}, it's {me} with M&E. Checking in on the quote I sent for {service}. Any questions I can answer, or are you ready to get it on the schedule?",
  thanks: "Thanks for the work today, {first}. If you need anything else this week, just text me. {me}, M&E Hydrovac"
};
const TEMPLATE_NAMES = { checkin: "Daily check-in", intro: "Intro to a new customer", quote: "Quote follow-up", thanks: "Thank you after a job" };
const DEFAULT_SETTINGS = { myName: "", templates: { ...DEFAULT_TEMPLATES }, validDays: 14, warnDays: 4, staleDays: 14 };
const SERVICES = ["Hydrovac excavation","Vacuum truck","Roll-off (open top)","Vacuum box","Other"];
const STAGES = { lead:"Lead", quoted:"Quoted", won:"Won", lost:"Lost" };
const FREQ = { daily:"Daily", weekly:"Weekly", occasional:"Occasional" };
const TITLES = { today:"Today", onecalls:"One-calls", customers:"Customers", jobs:"Jobs", sales:"Sales" };

const configured = !String(firebaseConfig.apiKey).startsWith("PASTE");
let app, auth, db;
if (configured) {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  // Offline mode: the app keeps working with bad signal and syncs when you're back in service.
  try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
  catch { db = getFirestore(app); }
}

const S = {
  user: null, tab: "today",
  onecalls: [], customers: [], deals: [], jobs: [],
  settings: { ...DEFAULT_SETTINGS },
  loaded: {},
  custFilter: "due", custSearch: "", dealFilter: "open"
};
let unsubs = [];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const todayStr = () => ymd(Date.now());
const addDaysStr = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const startOfDay = ms => { const d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); };
const daysAgo = ms => Math.round((startOfDay(Date.now()) - startOfDay(ms)) / DAY);
const fmtDate = ms => new Date(ms).toLocaleDateString("en-US", { month:"numeric", day:"numeric", year:"2-digit" });
const fmtDT = ms => new Date(ms).toLocaleString("en-US", { month:"numeric", day:"numeric", hour:"numeric", minute:"2-digit" });
const fmtTime = ms => new Date(ms).toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit" });
const fmtYmd = s => { if (!s) return ""; const [y,m,d] = s.split("-"); return `${+m}/${+d}/${y.slice(2)}`; };
const dayLabel = s => s === todayStr() ? "Today" : s === addDaysStr(1) ? "Tomorrow" : parseYmd(s).toLocaleDateString("en-US", { weekday:"long", month:"numeric", day:"numeric" });
const toLocalInput = ms => { const d = new Date(ms); return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fromLocalInput = s => { const t = new Date(s).getTime(); return isNaN(t) ? null : t; };
const money = n => (Number(n) || 0).toLocaleString("en-US", { style:"currency", currency:"USD", maximumFractionDigits:0 });
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const col = name => collection(db, ROOT, S.user.uid, name);
const dref = (name, id) => doc(db, ROOT, S.user.uid, name, id);
const val = id => (document.getElementById(id)?.value ?? "").trim();
const digits = p => String(p || "").replace(/[^\d+]/g, "");
// Writes are not awaited, so saving works instantly even with no signal. Errors still show.
const save = p => { p.catch(showErr); };

function toast(msg, ms = 3200) {
  const r = $("#toast-root");
  r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => (r.innerHTML = ""), ms);
}
function showErr(err) {
  console.error(err);
  toast(err?.code === "permission-denied"
    ? "Firebase blocked that. Check your Firestore rules."
    : `Something went wrong: ${err?.message || err}`, 5000);
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
}
async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch { prompt("Copy this:", text); }
}
function smsHref(phone, body) {
  const sep = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent) ? "&" : "?";
  return `sms:${digits(phone)}${sep}body=${encodeURIComponent(body)}`;
}
function fillTemplate(key, ctx = {}) {
  const t = S.settings.templates?.[key] || DEFAULT_TEMPLATES[key] || "";
  const first = String(ctx.name || "").trim().split(/\s+/)[0] || "there";
  return t.replaceAll("{first}", first)
    .replaceAll("{company}", ctx.company || "your crew")
    .replaceAll("{service}", (ctx.service || "the work").toLowerCase())
    .replaceAll("{me}", S.settings.myName || "M&E");
}

const I = {
  today: '<svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  onecalls: '<svg class="i" viewBox="0 0 24 24"><path d="M6 21V4M6 4h11l-2.5 4L17 12H6"/></svg>',
  customers: '<svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v11H10l-6 4z"/></svg>',
  jobs: '<svg class="i" viewBox="0 0 24 24"><path d="M2 6h12v10H2zM14 9h4l4 4v3h-8"/><circle cx="6" cy="17.5" r="2"/><circle cx="17.5" cy="17.5" r="2"/></svg>',
  sales: '<svg class="i" viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-8M15 7h5v5"/></svg>',
  gear: '<svg class="i" viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>'
};

/* ---------- one-call logic ---------- */
function ocInfo(o) {
  const exp = (o.updatedAt || 0) + S.settings.validDays * DAY;
  const warn = exp - S.settings.warnDays * DAY;
  const now = Date.now();
  const daysLeft = Math.round((startOfDay(exp) - startOfDay(now)) / DAY);
  const status = now >= exp ? "expired" : now >= warn ? "due" : "ok";
  return { exp, warn, daysLeft, status };
}
function groupOC() {
  const rank = { expired:0, due:1, ok:2 };
  const m = new Map();
  for (const o of S.onecalls) {
    const k = (o.group || "Ungrouped").trim();
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(o);
  }
  return [...m].map(([name, items]) => {
    const infos = items.map(ocInfo);
    const exp = Math.min(...infos.map(i => i.exp));
    const status = infos.reduce((a, i) => rank[i.status] < rank[a] ? i.status : a, "ok");
    const daysLeft = Math.min(...infos.map(i => i.daysLeft));
    items.sort((a, b) => (a.sort ?? 999) - (b.sort ?? 999) || String(a.name || a.meNum || "").localeCompare(String(b.name || b.meNum || "")));
    return { name, items, exp, warn: exp - S.settings.warnDays * DAY, status, daysLeft };
  }).sort((a, b) => a.exp - b.exp || a.name.localeCompare(b.name));
}
function countHTML(g) {
  if (g.exp <= Date.now()) {
    const over = Math.max(0, -g.daysLeft);
    return `<div class="count">${over}<small>${over === 0 ? "expired today" : over === 1 ? "day expired" : "days expired"}</small></div>`;
  }
  if (g.daysLeft === 0) return `<div class="count">0<small>expires today</small></div>`;
  return `<div class="count">${g.daysLeft}<small>${g.daysLeft === 1 ? "day left" : "days left"}</small></div>`;
}
function statusText(g) {
  if (g.status === "expired") return "Expired, update right away";
  if (g.status === "due") return "Time to update";
  return `Update on ${fmtDate(g.warn)}`;
}
const ocTitle = o => o.name || (o.meNum ? `M&E ${o.meNum}` : "Ticket");

/* ---------- customer logic ---------- */
const textedToday = c => c.lastTexted && ymd(c.lastTexted) === todayStr();
const respToday = c => c.respDate === todayStr() ? c.resp : null;
function isDue(c) {
  if (textedToday(c)) return false;
  const age = c.lastTexted ? daysAgo(c.lastTexted) : 9999;
  const f = c.freq || "daily";
  return f === "daily" ? true : f === "weekly" ? age >= 7 : age >= 30;
}
const custName = c => c.company || c.name || "Unnamed customer";
function textCustomer(c, key = "checkin") {
  if (!digits(c.phone)) { toast("Add a phone number for this customer first."); return; }
  if (key === "checkin") save(updateDoc(dref("customers", c.id), { lastTexted: Date.now() }));
  location.href = smsHref(c.phone, fillTemplate(key, c));
}

/* ---------- deal logic ---------- */
const isOpen = d => d.stage === "lead" || d.stage === "quoted" || !d.stage;
const fuLate = d => isOpen(d) && d.followUp && d.followUp <= todayStr();
const lastContact = d => Math.max(d.createdAt || 0, ...(d.log || []).map(l => l.t || 0));
const isStale = d => isOpen(d) && daysAgo(lastContact(d)) >= (S.settings.staleDays || 14);

/* ---------- boot ---------- */
if (!configured) {
  $("#app").innerHTML = `<div class="login"><div class="brand">M&amp;E Hydrovac and Oilfield Services</div><h1>Almost ready</h1>
  <div class="note">Open <strong>index.html</strong> and paste your Firebase config into the block near the top that says <em>PASTE YOUR FIREBASE CONFIG HERE</em>. Then commit the file and reload this page.</div></div>`;
} else {
  onAuthStateChanged(auth, u => {
    S.user = u;
    unsubs.forEach(f => f()); unsubs = []; S.loaded = {};
    if (!u) { renderLogin(); return; }
    renderShell(); listen(); render();
  });
}

function listen() {
  for (const k of ["onecalls","customers","deals","jobs"]) {
    unsubs.push(onSnapshot(col(k), snap => {
      S[k] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      S.loaded[k] = true; render();
    }, showErr));
  }
  unsubs.push(onSnapshot(doc(db, ROOT, S.user.uid, "meta", "settings"), d => {
    const saved = d.exists() ? d.data() : {};
    const templates = { ...DEFAULT_TEMPLATES, ...(saved.templates || {}) };
    if (saved.template && !saved.templates?.checkin) templates.checkin = saved.template; // older version
    S.settings = { ...DEFAULT_SETTINGS, ...saved, templates };
    render();
  }, showErr));
}

function render() {
  if (!S.user || !$("#main")) return;
  const a = document.activeElement, aid = a && a.id;
  const sel = aid && typeof a.selectionStart === "number" ? [a.selectionStart, a.selectionEnd] : null;

    onecalls: groupOC().filter(g => g.status !== "ok").length,

const loading = () => `<p class="muted">Loading…</p>`;

/* ---------- TODAY ---------- */
function viewToday() {
  const dateLine = new Date().toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric" });
  const groups = groupOC();
  const hot = groups.filter(g => g.status !== "ok");
  const next = groups.find(g => g.status === "ok");
  const fu = S.deals.filter(fuLate).sort((a, b) => a.followUp.localeCompare(b.followUp));
  const stale = S.deals.filter(d => isStale(d) && !fuLate(d)).length;
  const due = S.customers.filter(isDue).length;
  const texted = S.customers.filter(textedToday).length;
  const yes = S.customers.filter(c => respToday(c) === "yes").length;
  const jobsToday = S.jobs.filter(j => j.date === todayStr());
  const jobsTom = S.jobs.filter(j => j.date === addDaysStr(1));

  let h = `<p class="muted" style="margin-bottom:18px">${esc(dateLine)}</p>`;

  h += `<section class="sec"><div class="sec-head"><h2>One-calls</h2><button class="btn sm" data-act="goto" data-tab="onecalls">See all</button></div>`;
  if (!S.loaded.onecalls) h += loading();
  else if (!groups.length) h += `<div class="note">No tickets yet. <a href="#" data-act="goto" data-tab="onecalls">Add your one-calls</a>.</div>`;
  else if (!hot.length) h += `<div class="note">Every one-call is current.${next ? ` Next update: ${esc(next.name)} on ${fmtDate(next.warn)}.` : ""}</div>`;
  else h += hot.map(g => `<button class="trow s-${g.status}" data-act="goto" data-tab="onecalls">
      <span class="flag"></span>
      <span><strong>${esc(g.name)}</strong><span class="meta">${plural(g.items.length,"ticket","tickets")}. Expires ${fmtDT(g.exp)}</span></span>
      ${countHTML(g)}</button>`).join("");
  h += `</section>`;

  h += `<section class="sec"><div class="sec-head"><h2>Check-in texts</h2></div>`;
  if (!S.loaded.customers) h += loading();
  else if (!S.customers.length) h += `<div class="note">Add your customers to start daily check-ins. <a href="#" data-act="goto" data-tab="customers">Go to customers</a>.</div>`;
  else {
    const total = due + texted, pct = total ? Math.round(texted / total * 100) : 100;
    h += `<div class="row"><div class="big-num">${due}</div><span class="meta">${due === 1 ? "customer still needs" : "customers still need"} a text today. ${texted} texted so far${yes ? `, ${yes} need service` : ""}.</span>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="btn-row">
        <button class="btn primary" data-act="goto" data-tab="customers" data-filter="due" ${due ? "" : "disabled"}>Start texting</button>
        ${yes ? `<button class="btn" data-act="goto" data-tab="customers" data-filter="yes">See who needs service</button>` : ""}
      </div></div>`;
  }
  h += `</section>`;

  h += `<section class="sec"><div class="sec-head"><h2>Jobs</h2><button class="btn sm" data-act="job-new">Book a job</button></div>`;
  if (!S.loaded.jobs) h += loading();
  else if (!jobsToday.length && !jobsTom.length) h += `<div class="note">No jobs booked for today or tomorrow.</div>`;
  else {
    if (jobsToday.length) h += `<p class="muted" style="margin:4px 0 6px">Today</p>` + jobsToday.map(jobRow).join("");
    if (jobsTom.length) h += `<p class="muted" style="margin:10px 0 6px">Tomorrow</p>` + jobsTom.map(jobRow).join("");
  }
  h += `</section>`;

  h += `<section class="sec"><div class="sec-head"><h2>Follow-ups due</h2><button class="btn sm" data-act="deal-new">New lead</button></div>`;
  if (!S.loaded.deals) h += loading();
  else if (!fu.length) h += `<div class="note">No follow-ups due today.${stale ? ` ${plural(stale, "lead hasn't", "leads haven't")} heard from you in a while. <a href="#" data-act="goto" data-tab="sales">Take a look</a>.` : ""}</div>`;
  else h += fu.map(dealRow).join("");
  h += `</section>`;
  return h;
}

function saveOC(id) {
  const data = {
    group: val("oc-group").toUpperCase() || "UNGROUPED", name: val("oc-name"), gps: val("oc-gps"),
    meNum: val("oc-me"), ticket: val("oc-ticket"), updatedAt: fromLocalInput(val("oc-when")) || Date.now()
  };
  if (id) {
    const old = S.onecalls.find(o => o.id === id);
    if (old && old.ticket && old.ticket !== data.ticket) data.history = [...(old.history || []), { ticket: old.ticket, updatedAt: old.updatedAt }].slice(-12);
    save(updateDoc(dref("onecalls", id), data));
  } else {
    save(addDoc(col("onecalls"), { ...data, history: [], createdAt: Date.now() }));
  }
  closeSheet(); toast("Ticket saved.");
}
function sheetGroupUpdate(gname) {

}
function saveGroupUpdate(gname) {
  const when = fromLocalInput(val("gu-when")) || Date.now();
  const items = S.onecalls.filter(o => (o.group || "Ungrouped").trim() === gname);
  const b = writeBatch(db);
  for (const o of items) {
    const nt = (document.querySelector(`[data-oc="${o.id}"]`)?.value || "").trim();
    b.update(dref("onecalls", o.id), {
      ticket: nt || o.ticket || "", updatedAt: when,
      history: [...(o.history || []), { ticket: o.ticket || "", updatedAt: o.updatedAt || 0 }].slice(-12)
    });
  }
  save(b.commit());
  closeSheet();
  toast(`${gname} updated. Next update due ${fmtDate(when + (S.settings.validDays - S.settings.warnDays) * DAY)}.`, 4500);
}
function copyGroup(gname) {

  const text = `${gname} one-calls (expire ${fmtDate(g.exp)})\n` + g.items.map(o =>

function groupICS(gname) {
  const g = groupOC().find(x => x.name === gname); if (!g) return;
  const d = new Date(g.warn); d.setHours(8, 0, 0, 0);
  if (d.getTime() < Date.now()) { toast("The reminder date already passed. Update these now."); return; }
  const stamp = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const end = new Date(d.getTime() + 30 * 60000);
  const u = new Date();
  const utc = `${u.getUTCFullYear()}${pad(u.getUTCMonth()+1)}${pad(u.getUTCDate())}T${pad(u.getUTCHours())}${pad(u.getUTCMinutes())}00Z`;
  const icsText = s => String(s).replace(/\\/g, "\\\\").replace(/[,;]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const desc = `Expires ${fmtDT(g.exp)}\n` + g.items.map(o => `${ocTitle(o)}: #${o.ticket}`).join("\n");
  const ics = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//M&E Sales Hub//EN","BEGIN:VEVENT",
    `UID:${Date.now()}-${Math.random().toString(36).slice(2)}@me-sales-hub`, `DTSTAMP:${utc}`,
    `DTSTART:${stamp(d)}`, `DTEND:${stamp(end)}`,
    `SUMMARY:${icsText("Update one-calls: " + gname)}`, `DESCRIPTION:${icsText(desc)}`,
    "BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY",`DESCRIPTION:${icsText("Update one-calls: " + gname)}`,"END:VALARM",
    "END:VEVENT","END:VCALENDAR"
  ].join("\r\n");
  download(`onecalls-${gname.replace(/[^a-z0-9]+/gi, "-").toLowerCase()}.ics`, ics, "text/calendar");
}

/* ---------- CUSTOMERS ---------- */
function custFiltered() {
  const f = S.custFilter, q = S.custSearch.toLowerCase();
  let list = S.customers.filter(c =>
    f === "all" ? true : f === "due" ? isDue(c) : f === "texted" ? textedToday(c) : f === "yes" ? respToday(c) === "yes" : (c.freq || "daily") === f);
  if (q) list = list.filter(c => [c.company, c.name, c.phone, c.notes].some(x => String(x || "").toLowerCase().includes(q)));
  return list.sort((a, b) => custName(a).localeCompare(custName(b)));
}
function custListHTML() {
  const list = custFiltered();
  if (!list.length) return `<div class="note">${S.custFilter === "due" && S.customers.length ? "Everyone who needs a text today has one. Nice work." : "No customers match."}</div>`;
  return list.map(c => {
    const t = textedToday(c), r = respToday(c);
    let acts;
    if (!t) acts = `<button class="btn sm primary" data-act="cust-text" data-id="${c.id}">Text</button>`;
    else if (!r) acts = `<button class="btn sm good" data-act="cust-yes" data-id="${c.id}">Needs service</button>
      <button class="btn sm" data-act="cust-no" data-id="${c.id}">No service</button>`;
    else acts = r === "yes" ? `<button class="btn sm" data-act="job-new" data-cust="${c.id}">Book a job</button>` : "";
    return `<div class="row">
      <button class="row-main" data-act="cust-edit" data-id="${c.id}">
        <strong>${esc(custName(c))}</strong>
        <span class="meta">${esc([c.company ? c.name : "", c.phone].filter(Boolean).join(", "))}</span>
        <span class="meta"><span class="pill">${FREQ[c.freq || "daily"]}</span>${
          r === "yes" ? `<span class="pill yes">Needs service</span>` :

function viewCustomers() {
  if (!S.loaded.customers) return loading();
  if (!S.customers.length) return `<div class="empty"><h2>No customers yet</h2>
    <p>Paste your list from Excel or Google Sheets, or add customers one at a time.</p>
    <div class="btn-row"><button class="btn primary" data-act="cust-import">Import a list</button><button class="btn" data-act="cust-new">Add a customer</button></div></div>`;
  const due = S.customers.filter(isDue).length, texted = S.customers.filter(textedToday).length;
  const total = due + texted, pct = total ? Math.round(texted / total * 100) : 100;

    <div class="sheet-acts"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="import-save">Import</button></div>`);

function doImport() {
  const lines = val("imp-text").split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const have = new Set(S.customers.map(c => digits(c.phone)).filter(p => p.length >= 10));
  const rows = []; let skipped = 0;
  for (const line of lines) {
    const parts = line.split(/\t|,/).map(p => p.trim()).filter(Boolean);
    let phone = "", freq = "daily"; const rest = [];
    for (const p of parts) {
      if (!phone && p.replace(/\D/g, "").length >= 10) phone = p;
      else if (/^(daily|weekly|occasional)$/i.test(p)) freq = p.toLowerCase();
      else rest.push(p);
    }
    if (/^company$/i.test(rest[0] || "")) continue; // header row
    if (!rest.length && !phone) continue;
    if (phone && have.has(digits(phone))) { skipped++; continue; } // already in the list
    if (phone) have.add(digits(phone));
    rows.push({ company: rest[0] || "", name: rest[1] || "", phone, freq, notes: rest.slice(2).join(", "), lastTexted: 0, createdAt: Date.now() });
  }
  if (!rows.length) { toast(skipped ? "Those customers are already in your list." : "Nothing to import. Check the format."); return; }
  for (let i = 0; i < rows.length; i += 400) {
    const b = writeBatch(db);
    rows.slice(i, i + 400).forEach(r => b.set(doc(col("customers")), r));
    save(b.commit());
  }
  closeSheet(); toast(`Imported ${plural(rows.length, "customer", "customers")}${skipped ? `, skipped ${skipped} already in your list` : ""}.`, 4500);
}
function exportCSV() {
  const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const lines = [["Company","Contact","Phone","Frequency","Notes","Last texted"].map(q).join(",")]
    .concat(S.customers.map(c => [c.company, c.name, c.phone, c.freq || "daily", c.notes, c.lastTexted ? fmtDate(c.lastTexted) : ""].map(q).join(",")));
  download(`me-customers-${todayStr()}.csv`, lines.join("\n"), "text/csv");
}

/* ---------- events ---------- */
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  if (e.target.id === "cust-search") { S.custSearch = e.target.value; const l = $("#cust-list"); if (l) l.innerHTML = custListHTML(); }
});
document.addEventListener("click", async e => {
  if (e.target.matches("[data-scrim]")) { closeSheet(); return; }
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if (t.tagName === "A") e.preventDefault();
  const byId = (arr, x) => S[arr].find(o => o.id === x);
  try {
    switch (act) {
      case "login": return doLogin();
      case "tab": S.tab = t.dataset.tab; closeSheet(); render(); scrollTo(0, 0); return;
      case "goto": S.tab = t.dataset.tab; if (t.dataset.filter) S.custFilter = t.dataset.filter; render(); scrollTo(0, 0); return;
      case "close": return closeSheet();
      case "settings": return sheetSettings();
      case "set-save": return saveSettings();
      case "signout": closeSheet(); return await signOut(auth);
      case "export": return download(`me-sales-hub-backup-${todayStr()}.json`,
        JSON.stringify({ onecalls: S.onecalls, customers: S.customers, deals: S.deals, jobs: S.jobs, settings: S.settings }, null, 2), "application/json");
      case "export-csv": return exportCSV();

      case "oc-new": return sheetOC();
      case "oc-edit": return sheetOC(byId("onecalls", id));
      case "oc-save": return saveOC(id);
      case "oc-del": if (confirm("Delete this ticket?")) { save(deleteDoc(dref("onecalls", id))); closeSheet(); toast("Ticket deleted."); } return;
      case "oc-seed": if (S.onecalls.length) return; t.disabled = true; return seedTickets();
      case "oc-group-update": return sheetGroupUpdate(t.dataset.g);
      case "gu-save": return saveGroupUpdate(t.dataset.g);
      case "oc-copy": return copyGroup(t.dataset.g);
      case "oc-ics": return groupICS(t.dataset.g);

      case "cust-filter": S.custFilter = t.dataset.f; return render();
      case "cust-new": return sheetCust();
      case "cust-edit": return sheetCust(byId("customers", id));
      case "cust-save": return saveCust(id);
      case "cust-del": if (confirm("Delete this customer?")) { save(deleteDoc(dref("customers", id))); closeSheet(); toast("Customer deleted."); } return;
      case "cust-text": return textCustomer(byId("customers", id));
      case "cust-tpl": return textCustomer(byId("customers", id), t.dataset.key);
      case "cust-next": { const c = custFiltered().find(isDue) || S.customers.filter(isDue).sort((a, b) => custName(a).localeCompare(custName(b)))[0]; if (c) textCustomer(c); return; }
      case "cust-untext": return save(updateDoc(dref("customers", id), { lastTexted: 0, resp: null, respDate: null }));
      case "cust-yes": { const c = byId("customers", id); save(updateDoc(dref("customers", id), { resp: "yes", respDate: todayStr() })); return sheetJob({ customer: custName(c), customerId: c.id }); }
      case "cust-no": return save(updateDoc(dref("customers", id), { resp: "no", respDate: todayStr() }));
      case "cust-import": return sheetImport();
      case "import-save": return doImport();

      case "job-new": { const c = t.dataset.cust ? byId("customers", t.dataset.cust) : null; return sheetJob(c ? { customer: custName(c), customerId: c.id } : {}); }
      case "job-edit": return sheetJob(byId("jobs", id));
      case "job-save": return saveJob(id, t.dataset.cust);
      case "job-del": if (confirm("Delete this job?")) { save(deleteDoc(dref("jobs", id))); closeSheet(); toast("Job deleted."); } return;
      case "job-done": { const j = byId("jobs", id); return save(updateDoc(dref("jobs", id), { done: !j.done })); }
      case "jobs-copy": return copyJobs(t.dataset.date);

      case "deal-new": return sheetDeal();
      case "deal-edit": return sheetDeal(byId("deals", id));
      case "deal-save": return saveDeal(id);
      case "deal-log": return logDeal(id, Number(t.dataset.days) || 3);
      case "deal-text": return textDeal(id, t.dataset.key);
      case "deal-del": if (confirm("Delete this lead?")) { save(deleteDoc(dref("deals", id))); closeSheet(); toast("Lead deleted."); } return;
      case "deal-filter": S.dealFilter = t.dataset.f; return render();
    }
  } catch (err) { t.disabled = false; showErr(err); }
});

// Keep countdowns fresh
setInterval(render, 5 * 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
</script>
</body>
</html>
