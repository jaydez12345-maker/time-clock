function readAndCompressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxW = 1000;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.6));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const WEBAUTHN_SUPPORTED = !!window.PublicKeyCredential;
function getStoredCredentialId() { return localStorage.getItem("tc_webauthn_cred_id"); }
async function setupFingerprint() {
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const userId = crypto.getRandomValues(new Uint8Array(16));
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge,
      rp: { name: "Time Clock" },
      user: { id: userId, name: "device-user", displayName: "Time Clock device" },
      pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
      authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
      timeout: 60000
    }
  });
  const id = btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
  localStorage.setItem("tc_webauthn_cred_id", id);
}
async function verifyFingerprint() {
  const storedId = getStoredCredentialId();
  if (!storedId) return true;
  const idBytes = Uint8Array.from(atob(storedId), c => c.charCodeAt(0));
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  await navigator.credentials.get({
    publicKey: { challenge, allowCredentials: [{ id: idBytes, type: "public-key" }], userVerification: "required", timeout: 60000 }
  });
  return true;
}

function fmtTime(ts) { return ts.toDate().toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }); }
function distanceFeet(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c * 3.28084;
}
function renderLocationText() {
  if (locState === "checking") { locationText.textContent = "Checking your location…"; return; }
  if (locState === "denied") { locationText.textContent = "Location access is off — turn it on in your phone settings to clock in/out."; return; }
  if (locState === "error") { locationText.textContent = "Couldn't get your location. Tap the button to try again."; return; }
  if (locState === "out") { locationText.textContent = `You're ${locDistanceFt} ft from the job site — must be within ${RADIUS_FEET} ft.`; return; }
  locationText.textContent = `At job site (${locDistanceFt} ft away)`;
}
function checkLocation() {
  locState = "checking";
  renderLocationText(); renderButton();
  if (!navigator.geolocation) { locState = "error"; renderLocationText(); renderButton(); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const dist = distanceFeet(pos.coords.latitude, pos.coords.longitude, JOB_SITE.lat, JOB_SITE.lng);
      locDistanceFt = Math.round(dist);
      locState = dist <= RADIUS_FEET ? "ok" : "out";
      renderLocationText(); renderButton();
    },
    err => { console.error(err); locState = err.code === 1 ? "denied" : "error"; renderLocationText(); renderButton(); },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
  );
}

    let statusData = doc.exists ? doc.data() : null;
    if (!statusData) {
      const snap = await punches.where("name", "==", name).get();
      let last = null;
      snap.forEach(d => {
        const data = d.data();
        if (data.timestamp && (!last || data.timestamp.toMillis() > last.timestamp.toMillis())) last = data;
      });
      if (last) { statusData = last; statusCol.doc(name).set(statusData).catch(() => {}); }
    }
    if (!statusData) {
      currentStatus = "out"; lastPunchDeviceId = null;
      statusText.textContent = "Not clocked in"; lastPunchText.textContent = "";
    } else {
      currentStatus = statusData.action;
      lastPunchDeviceId = statusData.deviceId || null;
      statusText.textContent = statusData.action === "in" ? "Clocked in" : "Clocked out";
      lastPunchText.textContent = statusData.timestamp ? "Last: " + statusData.action.toUpperCase() + " at " + fmtTime(statusData.timestamp) : "";
    }
    renderButton();
  } catch (err) {
    console.error(err);
    hasError = true;
    statusText.textContent = "Couldn't connect";
    lastPunchText.textContent = err.code ? "(" + err.code + ")" : "";
    renderButton();
  }
}
function renderButton() {
  if (hasError) { punchBtn.disabled = false; punchBtn.textContent = "Tap to retry"; punchBtn.className = "punch out"; return; }
  if (locState === "checking") { punchBtn.disabled = true; punchBtn.textContent = "Checking location…"; punchBtn.className = "punch in"; return; }
  if (locState === "denied" || locState === "error") { punchBtn.disabled = false; punchBtn.textContent = "Enable location & retry"; punchBtn.className = "punch out"; return; }
  if (locState === "out") { punchBtn.disabled = false; punchBtn.textContent = "Check location again"; punchBtn.className = "punch out"; return; }
  if (currentStatus === null) { punchBtn.disabled = true; punchBtn.textContent = "Loading…"; punchBtn.className = "punch in"; return; }
  punchBtn.disabled = false;
  if (currentStatus === "in") { punchBtn.textContent = "Clock Out"; punchBtn.className = "punch out"; }
  else { punchBtn.textContent = "Clock In"; punchBtn.className = "punch in"; }
}
punchBtn.addEventListener("click", async () => {
  if (hasError) { refreshStatus(); return; }
  if (locState === "denied" || locState === "error" || locState === "out") { checkLocation(); return; }
  if (locState === "checking") { return; }
  const name = employeeSelect.value;
  const action = currentStatus === "in" ? "out" : "in";
  if (action === "out" && lastPunchDeviceId && lastPunchDeviceId !== deviceId) {
    statusText.textContent = "Locked to another device";
    lastPunchText.textContent = name + " has to clock out from the phone they clocked in on.";
    return;
  }
  const pinOk = await requestPin(name);
  if (!pinOk) return;
  if (getStoredCredentialId()) {
    try { await verifyFingerprint(); }
    catch (err) {
      console.error(err);
      statusText.textContent = "Face ID not confirmed";
      lastPunchText.textContent = "Try again to clock " + action + ".";
      return;
    }
  }
  punchBtn.disabled = true;
  punchBtn.textContent = "Checking location…";
  navigator.geolocation.getCurrentPosition(
    async pos => {
      const dist = distanceFeet(pos.coords.latitude, pos.coords.longitude, JOB_SITE.lat, JOB_SITE.lng);
      if (dist > RADIUS_FEET) {
        locState = "out"; locDistanceFt = Math.round(dist);
        renderLocationText(); renderButton();
        return;
      }
      let report = null;
      if (action === "out") {
        report = await requestReport(name);
        if (!report) { renderButton(); return; }
      }
      punchBtn.textContent = "Saving…";
      try {
        const payload = { name, action, timestamp: firebase.firestore.FieldValue.serverTimestamp(), lat: pos.coords.latitude, lng: pos.coords.longitude, deviceId };
        if (report) {
          payload.description = report.description;
          if (report.photo) payload.photo = report.photo;
        }
        const batch = db.batch();
        batch.set(punches.doc(), payload);
        batch.set(statusCol.doc(name), payload);
        await batch.commit();
        await refreshStatus();
      } catch (err) {
        punchBtn.textContent = "Couldn't save — tap to retry"; punchBtn.disabled = false; console.error(err);
      }
    },
    err => { console.error(err); locState = err.code === 1 ? "denied" : "error"; renderLocationText(); renderButton(); },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
  );
});
employeeSelect.addEventListener("change", refreshStatus);
refreshStatus();
checkLocation();
myHoursLink.addEventListener("click", async () => {
  const name = employeeSelect.value;
  const ok = await requestPin(name);
  if (!ok) return;
  myHoursTitle.textContent = name + "'s hours";
  const today = new Date();
  myHoursDate.value = today.toISOString().slice(0, 10);
  clockView.classList.add("hidden");
  myHoursView.classList.remove("hidden");
  loadMyHours(name, myHoursDate.value);
});
myHoursDate.addEventListener("change", () => loadMyHours(employeeSelect.value, myHoursDate.value));
myHoursBackBtn.addEventListener("click", () => {
  myHoursView.classList.add("hidden");
  clockView.classList.remove("hidden");
});
myUploadsLink.addEventListener("click", async () => {
  const name = employeeSelect.value;
  const ok = await requestPin(name);
  if (!ok) return;
  myUploadsTitle.textContent = name + "'s uploads";
  clockView.classList.add("hidden");
  myUploadsView.classList.remove("hidden");
  loadMyUploads(name);
});
myUploadsBackBtn.addEventListener("click", () => {
  myUploadsView.classList.add("hidden");
  clockView.classList.remove("hidden");
});
async function loadMyUploads(name) {
  myUploadsWrap.innerHTML = "<div class=\"empty\">Loading…</div>";
  try {
    const snap = await uploadsCol.where("name", "==", name).get();
    const rows = [];
    snap.forEach(d => { const data = d.data(); if (data.timestamp) rows.push(data); });
    rows.sort((a, b) => b.timestamp.toMillis() - a.timestamp.toMillis());
    if (!rows.length) { myUploadsWrap.innerHTML = "<div class=\"empty\">No photos uploaded yet.</div>"; return; }
    let html = "";
    rows.forEach(r => {
      const t = r.timestamp.toDate().toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      html += `<div style="margin-bottom:16px;"><p style="font-size:13px;color:var(--ink);margin:0 0 6px;">${t}</p><img src="${r.photo}" style="max-width:100%;border-radius:8px;"></div>`;
    });
    myUploadsWrap.innerHTML = html;
  } catch (err) {
    console.error(err);
    myUploadsWrap.innerHTML = "<div class=\"empty\">Couldn't load: " + (err.code || err.message) + "</div>";
  }
}
async function loadMyHours(name, dateStr) {
  myHoursWrap.innerHTML = "<div class=\"empty\">Loading…</div>";
  try {
    const snap = await punches.where("name", "==", name).get();
    const start = new Date(dateStr + "T00:00:00");
    const end = new Date(dateStr + "T23:59:59.999");
    const rows = [];
    snap.forEach(d => {
      const data = d.data();
      if (data.timestamp && data.timestamp.toDate() >= start && data.timestamp.toDate() <= end) rows.push(data);
    });
    rows.sort((a, b) => a.timestamp.toMillis() - b.timestamp.toMillis());
    if (!rows.length) { myHoursWrap.innerHTML = "<div class=\"empty\">No punches on this date.</div>"; return; }
    let html = "<table><thead><tr><th>Action</th><th>Time</th></tr></thead><tbody>";
    rows.forEach(r => {
      const t = r.timestamp.toDate().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      html += `<tr><td><span class="tag ${r.action}">${r.action.toUpperCase()}</span></td><td>${t}</td></tr>`;
    });
    html += "</tbody></table>";
    const withNotes = rows.filter(r => r.description);
    if (withNotes.length) {
      html += "<div class=\"totals\"><h3>Work summary</h3>";
      withNotes.forEach(r => {
        const t = r.timestamp.toDate().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        html += `<div style="padding:10px 0;border-bottom:1px solid var(--line);"><strong>${t}</strong><p style="margin:4px 0;">${escapeHtml(r.description)}</p>`;
        if (r.photo) html += `<img src="${r.photo}" style="max-width:100%;border-radius:8px;margin-top:6px;">`;
        html += "</div>";
      });
      html += "</div>";
    }
    myHoursWrap.innerHTML = html;
  } catch (err) {
    console.error(err);
    myHoursWrap.innerHTML = "<div class=\"empty\">Couldn't load: " + (err.code || err.message) + "</div>";
  }
}
const clockView = document.getElementById("clockView");
const lockView = document.getElementById("lockView");
const adminView = document.getElementById("admin");
const openAdminLink = document.getElementById("openAdminLink");
const backToClockLink = document.getElementById("backToClockLink");
const backToClockBtn = document.getElementById("backToClockBtn");
const passcodeInput = document.getElementById("passcodeInput");
const unlockBtn = document.getElementById("unlockBtn");
const dateFilter = document.getElementById("dateFilter");
const logTableWrap = document.getElementById("logTableWrap");
const totalsWrap = document.getElementById("totalsWrap");
const exportBtn = document.getElementById("exportBtn");
function showView(view) {
  clockView.classList.add("hidden"); lockView.classList.add("hidden"); adminView.classList.add("hidden");
  view.classList.remove("hidden");
}
openAdminLink.addEventListener("click", () => showView(lockView));
backToClockLink.addEventListener("click", () => showView(clockView));
backToClockBtn.addEventListener("click", () => showView(clockView));
unlockBtn.addEventListener("click", () => {
  if (passcodeInput.value === ADMIN_PASSCODE) {
    passcodeInput.value = "";
    const today = new Date();
    dateFilter.value = today.toISOString().slice(0, 10);
    showView(adminView);
    loadLog();
    loadAdminUploads();
  } else {
    passcodeInput.value = ""; passcodeInput.placeholder = "Wrong passcode — try again";
  }
});
let currentRows = [];
async function loadLog() {
  logTableWrap.innerHTML = "<div class=\"empty\">Loading…</div>";
  totalsWrap.innerHTML = "";
  const day = dateFilter.value;
  const start = new Date(day + "T00:00:00");
  const end = new Date(day + "T23:59:59.999");
  try {
    const snap = await punches.where("timestamp", ">=", start).where("timestamp", "<=", end).orderBy("timestamp", "asc").get();
    currentRows = snap.docs.map(d => d.data());
    renderTable(currentRows);
  } catch (err) {
    console.error(err);
    logTableWrap.innerHTML = "<div class=\"empty\">Couldn't load: " + (err.code || err.message) + "</div>";
  }
}
function computeHours(events) {
  let totalMs = 0; let openIn = null;
  events.forEach(e => {
    if (e.action === "in") { openIn = e.timestamp.toDate(); }
    else if (e.action === "out" && openIn) { totalMs += e.timestamp.toDate() - openIn; openIn = null; }
  });
  const hours = (totalMs / 3600000).toFixed(2);
  return openIn ? hours + " hrs (still clocked in)" : hours + " hrs";
}
function renderTable(rows) {
  if (!rows.length) { logTableWrap.innerHTML = "<div class=\"empty\">No punches on this date.</div>"; return; }
  const byEmployee = {};
  rows.forEach(r => { if (!byEmployee[r.name]) byEmployee[r.name] = []; byEmployee[r.name].push(r); });
  const names = Object.keys(byEmployee).sort();
  let html = "";
  names.forEach(name => {
    const events = byEmployee[name];
    html += `<div class="emp-group"><div class="emp-header"><h3 class="emp-name">${escapeHtml(name)}</h3><span class="emp-hours">${computeHours(events)}</span></div>`;
    html += "<table><thead><tr><th>Action</th><th>Time</th><th>Location</th></tr></thead><tbody>";
    events.forEach(r => {
      const t = r.timestamp ? r.timestamp.toDate().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "—";
      const loc = (r.lat != null && r.lng != null) ? `<a href="https://maps.google.com/?q=${r.lat},${r.lng}" target="_blank" rel="noopener">Map</a>` : "—";
      html += `<tr><td><span class="tag ${r.action}">${r.action.toUpperCase()}</span></td><td>${t}</td><td>${loc}</td></tr>`;
    });
    html += "</tbody></table></div>";
  });
  logTableWrap.innerHTML = html;
}
dateFilter.addEventListener("change", loadLog);
exportBtn.addEventListener("click", () => {
  if (!currentRows.length) return;
  let csv = "Employee,Action,Timestamp,Latitude,Longitude\n";
  currentRows.forEach(r => {
    const iso = r.timestamp ? r.timestamp.toDate().toISOString() : "";
    csv += `"${r.name.replace(/"/g, '""')}",${r.action},${iso},${r.lat ?? ""},${r.lng ?? ""}\n`;
  });
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `time-log-${dateFilter.value}.csv`; a.click();
  URL.revokeObjectURL(url);
});
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
async function loadAdminUploads() {
  adminUploadsWrap.innerHTML = "<div class=\"empty\">Loading…</div>";
  try {
    const snap = await uploadsCol.orderBy("timestamp", "desc").limit(100).get();
    if (snap.empty) { adminUploadsWrap.innerHTML = "<div class=\"empty\">No photos uploaded yet.</div>"; return; }
    let html = "";
    snap.forEach(d => {
      const r = d.data();
      const t = r.timestamp ? r.timestamp.toDate().toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
      html += `<div style="margin-bottom:16px;"><p style="font-size:13px;color:var(--ink);margin:0 0 6px;"><strong>${escapeHtml(r.name)}</strong> — ${t}</p><img src="${r.photo}" style="max-width:100%;border-radius:8px;"></div>`;
    });
    adminUploadsWrap.innerHTML = html;
  } catch (err) {
    console.error(err);
    adminUploadsWrap.innerHTML = "<div class=\"empty\">Couldn't load: " + (err.code || err.message) + "</div>";
  }
}
