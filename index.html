<style>
  :root {
    --ink: #f5f5f5;
    --paper: #000000;
    --surface: #141414;
    --field: #1c1c1c;
    --line: #333333;
    --muted: #a3a3a3;
    --red: #d81e2c;
    --red-dark: #8c1218;
    --danger: #ff6b6b;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body { display: flex; flex-direction: column; align-items: center; padding: 32px 20px 48px; }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: 0.02em; color: var(--red); margin-bottom: 16px; }
  .logo-banner { max-width: 260px; width: 100%; height: auto; border-radius: 10px; margin-bottom: 18px; }
  .card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 24px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  select, input[type="text"], input[type="password"] {
    width: 100%; font-size: 17px; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--field); color: var(--ink); margin-bottom: 20px;
  }
  select:focus, input:focus, button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  textarea {
    width: 100%; font-size: 15px; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--field); color: var(--ink); margin-bottom: 12px;
    font-family: inherit; resize: vertical;
  }
  input[type="file"] { width: 100%; font-size: 14px; margin-bottom: 8px; color: var(--ink); }
  .field-error { color: var(--danger); font-size: 13px; margin: -8px 0 12px; }
  .status-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; font-size: 14px; color: var(--muted); }
  .status-row strong { color: var(--ink); }
  button.punch { width: 100%; border: none; border-radius: 12px; padding: 20px; font-size: 19px; font-weight: 600; color: #fff; cursor: pointer; transition: transform 0.06s ease; }
  button.punch:active { transform: scale(0.98); }
  button.punch.in { background: var(--red); }
  button.punch.in:hover { background: var(--red-dark); }
  button.punch.out { background: var(--red-dark); }
  button.punch:disabled { background: #4a4a4a; cursor: default; }
  .last-punch { text-align: center; font-size: 13px; color: var(--muted); margin-top: 16px; min-height: 16px; }
  .admin-link { margin-top: 28px; font-size: 13px; color: var(--muted); text-decoration: underline; background: none; border: none; cursor: pointer; padding: 8px; }
  #admin, #myHoursView { width: 100%; max-width: 720px; }
  .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; }
  .admin-header h2 { font-size: 20px; margin: 0; color: var(--red); }
  .admin-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .admin-controls input[type="date"] { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; background: var(--field); color: var(--ink); }
  .btn-small { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); font-size: 14px; cursor: pointer; color: var(--ink); }
  .btn-small:hover { background: #262626; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  thead th { text-align: left; font-size: 12px; color: var(--muted); padding: 10px 14px; background: var(--field); border-bottom: 1px solid var(--line); }
  tbody td { padding: 10px 14px; font-size: 14px; border-bottom: 1px solid var(--line); color: var(--ink); }
  tbody tr:last-child td { border-bottom: none; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .tag.in { background: rgba(216,30,44,0.18); color: #ff6b6b; }
  .tag.out { background: rgba(140,18,24,0.35); color: #ff9d9d; }
  .totals { margin-top: 22px; }
  .totals h3 { font-size: 14px; color: var(--red); margin-bottom: 8px; }
  .total-row { display: flex; justify-content: space-between; font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .emp-group { margin-bottom: 20px; }
  .emp-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .emp-name { font-size: 15px; margin: 0; color: var(--red); }
  .emp-hours { font-size: 13px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
  .hidden { display: none !important; }
  .lock { max-width: 320px; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
  .lock input { margin-bottom: 14px; }
</style>
</head>

function getDeviceId() {
  let id = localStorage.getItem("tc_device_id");
  if (!id) {
    id = window.crypto && crypto.randomUUID ? crypto.randomUUID() : "dev-" + Math.random().toString(36).slice(2) + Date.now();

  }
  return id;
}
const deviceId = getDeviceId();
let trackWatchId = null;
let lastTrackWriteAt = 0;
const TRACK_MIN_INTERVAL_MS = 60000;
function startTracking(name) {
  stopTracking();
  if (!navigator.geolocation) return;
  lastTrackWriteAt = 0;
  trackWatchId = navigator.geolocation.watchPosition(
    pos => {
      const now = Date.now();
      if (now - lastTrackWriteAt < TRACK_MIN_INTERVAL_MS) return;
      lastTrackWriteAt = now;
      tracksCol.add({ name, lat: pos.coords.latitude, lng: pos.coords.longitude, timestamp: firebase.firestore.FieldValue.serverTimestamp(), deviceId }).catch(err => console.error(err));
    },
    err => console.error(err),
    { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 }
  );
}
function stopTracking() {
  if (trackWatchId !== null) { navigator.geolocation.clearWatch(trackWatchId); trackWatchId = null; }

function requestPin(name) {

      if (employeePinInput.value.trim() === correct) { cleanup(); resolve(true); }
      else { employeePinInput.value = ""; employeePinInput.placeholder = "Wrong code — try again"; }
    }
    function onCancel() { cleanup(); resolve(false); }
    pinConfirmBtn.addEventListener("click", onConfirm);
    pinCancelBtn.addEventListener("click", onCancel);
  });
}
function readAndCompressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxW = 1000;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.6));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function requestReport(name) {

        errorEl = document.createElement("div");

        reportDescription.insertAdjacentElement("afterend", errorEl);
      }
      errorEl.textContent = msg;
    }
    async function onPhotoChange() {
      const file = reportPhotoInput.files[0];
      if (!file) { photoDataUrl = null; reportPhotoPreviewWrap.innerHTML = ""; return; }
      reportPhotoPreviewWrap.innerHTML = "<p style=\"font-size:13px;color:var(--ink);\">Processing photo…</p>";
      try {
        const dataUrl = await readAndCompressImage(file);
        if (dataUrl.length > 900000) {
          photoDataUrl = null;
          reportPhotoPreviewWrap.innerHTML = "<p class=\"field-error\">Photo's too large — try taking it from farther away, or skip the photo.</p>";
        } else {
          photoDataUrl = dataUrl;
          reportPhotoPreviewWrap.innerHTML = `<img src="${dataUrl}" style="max-width:100%;border-radius:8px;margin-top:8px;">`;
        }
      } catch (err) {
        console.error(err);
        photoDataUrl = null;
        reportPhotoPreviewWrap.innerHTML = "<p class=\"field-error\">Couldn't read that photo.</p>";
      }
    }
    function cleanup() {
      reportSubmitBtn.removeEventListener("click", onSubmit);
      reportCancelBtn.removeEventListener("click", onCancel);
      reportPhotoInput.removeEventListener("change", onPhotoChange);
      if (errorEl) errorEl.remove();
      reportView.classList.add("hidden");
      clockView.classList.remove("hidden");
    }
    function onSubmit() {
      const desc = reportDescription.value.trim();
      if (!desc) { showError("Enter a description of today's work first."); return; }
      const result = { description: desc, photo: photoDataUrl };
      cleanup();
      resolve(result);
    }
    function onCancel() { cleanup(); resolve(null); }
    reportPhotoInput.addEventListener("change", onPhotoChange);
    reportSubmitBtn.addEventListener("click", onSubmit);
    reportCancelBtn.addEventListener("click", onCancel);
  });
}

const WEBAUTHN_SUPPORTED = !!window.PublicKeyCredential;
function getStoredCredentialId() { return localStorage.getItem("tc_webauthn_cred_id"); }
async function setupFingerprint() {
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const userId = crypto.getRandomValues(new Uint8Array(16));
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge,
      rp: { name: "Time Clock" },
      user: { id: userId, name: "device-user", displayName: "Time Clock device" },
      pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
      authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
      timeout: 60000
    }
  });
  const id = btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
  localStorage.setItem("tc_webauthn_cred_id", id);
}
async function verifyFingerprint() {
  const storedId = getStoredCredentialId();
  if (!storedId) return true;
  const idBytes = Uint8Array.from(atob(storedId), c => c.charCodeAt(0));
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  await navigator.credentials.get({
    publicKey: { challenge, allowCredentials: [{ id: idBytes, type: "public-key" }], userVerification: "required", timeout: 60000 }
  });
  return true;
}
async function initFingerprintUI() {
  if (!WEBAUTHN_SUPPORTED) return;
  let available = false;
  try { available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); } catch (e) {}
  if (!available) return;
  setupFingerprintBtn.style.display = "block";
  if (getStoredCredentialId()) {
    setupFingerprintBtn.textContent = "Face ID enabled on this phone";
    setupFingerprintBtn.disabled = true;
  } else {
    setupFingerprintBtn.textContent = "Set up Face ID for this phone";
  }
}

});

function fmtTime(ts) { return ts.toDate().toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }); }
function distanceFeet(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c * 3.28084;
}
function renderLocationText() {
  if (locState === "checking") { locationText.textContent = "Checking your location…"; return; }
  if (locState === "denied") { locationText.textContent = "Location access is off — turn it on in your phone settings to clock in/out."; return; }
  if (locState === "error") { locationText.textContent = "Couldn't get your location. Tap the button to try again."; return; }
  if (locState === "out") { locationText.textContent = `You're ${locDistanceFt} ft from the job site — must be within ${RADIUS_FEET} ft.`; return; }
  locationText.textContent = `At job site (${locDistanceFt} ft away)`;
}
function checkLocation() {
  locState = "checking";
  renderLocationText(); renderButton();
  if (!navigator.geolocation) { locState = "error"; renderLocationText(); renderButton(); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const dist = distanceFeet(pos.coords.latitude, pos.coords.longitude, JOB_SITE.lat, JOB_SITE.lng);
      locDistanceFt = Math.round(dist);
      locState = dist <= RADIUS_FEET ? "ok" : "out";
      renderLocationText(); renderButton();
    },
    err => { console.error(err); locState = err.code === 1 ? "denied" : "error"; renderLocationText(); renderButton(); },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
  );
}
async function refreshStatus() {
  hasError = false;
  punchBtn.disabled = true;
  punchBtn.textContent = "Loading…";
  const name = employeeSelect.value;
  localStorage.setItem("tc_employee", name);
  try {
    const doc = await statusCol.doc(name).get();
    let statusData = doc.exists ? doc.data() : null;
    if (!statusData) {
      const snap = await punches.where("name", "==", name).get();
      let last = null;
      snap.forEach(d => {
        const data = d.data();
        if (data.timestamp && (!last || data.timestamp.toMillis() > last.timestamp.toMillis())) last = data;
      });
      if (last) { statusData = last; statusCol.doc(name).set(statusData).catch(() => {}); }
    }
    if (!statusData) {
      currentStatus = "out"; lastPunchDeviceId = null;
      statusText.textContent = "Not clocked in"; lastPunchText.textContent = "";
    } else {
      currentStatus = statusData.action;
      lastPunchDeviceId = statusData.deviceId || null;
      statusText.textContent = statusData.action === "in" ? "Clocked in" : "Clocked out";
      lastPunchText.textContent = statusData.timestamp ? "Last: " + statusData.action.toUpperCase() + " at " + fmtTime(statusData.timestamp) : "";
    }
    if (currentStatus === "in" && lastPunchDeviceId === deviceId) { startTracking(name); } else { stopTracking(); }
    renderButton();
  } catch (err) {
    console.error(err);
    hasError = true;
    statusText.textContent = "Couldn't connect";
    lastPunchText.textContent = err.code ? "(" + err.code + ")" : "";
    renderButton();
  }
}
function renderButton() {
  if (hasError) { punchBtn.disabled = false; punchBtn.textContent = "Tap to retry"; punchBtn.className = "punch out"; return; }
  if (locState === "checking") { punchBtn.disabled = true; punchBtn.textContent = "Checking location…"; punchBtn.className = "punch in"; return; }
  if (locState === "denied" || locState === "error") { punchBtn.disabled = false; punchBtn.textContent = "Enable location & retry"; punchBtn.className = "punch out"; return; }
  if (locState === "out") { punchBtn.disabled = false; punchBtn.textContent = "Check location again"; punchBtn.className = "punch out"; return; }
  if (currentStatus === null) { punchBtn.disabled = true; punchBtn.textContent = "Loading…"; punchBtn.className = "punch in"; return; }
  punchBtn.disabled = false;
  if (currentStatus === "in") { punchBtn.textContent = "Clock Out"; punchBtn.className = "punch out"; }
  else { punchBtn.textContent = "Clock In"; punchBtn.className = "punch in"; }
}
punchBtn.addEventListener("click", async () => {
  if (hasError) { refreshStatus(); return; }
  if (locState === "denied" || locState === "error" || locState === "out") { checkLocation(); return; }
  if (locState === "checking") { return; }
  const name = employeeSelect.value;
  const action = currentStatus === "in" ? "out" : "in";
  if (action === "out" && lastPunchDeviceId && lastPunchDeviceId !== deviceId) {
    statusText.textContent = "Locked to another device";
    lastPunchText.textContent = name + " has to clock out from the phone they clocked in on.";
    return;
  }
  const pinOk = await requestPin(name);
  if (!pinOk) return;
  if (getStoredCredentialId()) {
    try { await verifyFingerprint(); }
    catch (err) {
      console.error(err);
      statusText.textContent = "Face ID not confirmed";
      lastPunchText.textContent = "Try again to clock " + action + ".";
      return;
    }
  }
  punchBtn.disabled = true;
  punchBtn.textContent = "Checking location…";
  navigator.geolocation.getCurrentPosition(
    async pos => {
      const dist = distanceFeet(pos.coords.latitude, pos.coords.longitude, JOB_SITE.lat, JOB_SITE.lng);
      if (dist > RADIUS_FEET) {
        locState = "out"; locDistanceFt = Math.round(dist);
        renderLocationText(); renderButton();
        return;
      }
      let report = null;
      if (action === "out") {
        report = await requestReport(name);
        if (!report) { renderButton(); return; }
      }
      punchBtn.textContent = "Saving…";
      try {
        const payload = { name, action, timestamp: firebase.firestore.FieldValue.serverTimestamp(), lat: pos.coords.latitude, lng: pos.coords.longitude, deviceId };
        if (report) {
          payload.description = report.description;
          if (report.photo) payload.photo = report.photo;
        }
        const batch = db.batch();
        batch.set(punches.doc(), payload);
        batch.set(statusCol.doc(name), payload);
        await batch.commit();
        await refreshStatus();
      } catch (err) {
        punchBtn.textContent = "Couldn't save — tap to retry"; punchBtn.disabled = false; console.error(err);
      }
    },
    err => { console.error(err); locState = err.code === 1 ? "denied" : "error"; renderLocationText(); renderButton(); },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
  );
});

function computeHours(events) {
  let totalMs = 0; let openIn = null;
  events.forEach(e => {
    if (e.action === "in") { openIn = e.timestamp.toDate(); }
    else if (e.action === "out" && openIn) { totalMs += e.timestamp.toDate() - openIn; openIn = null; }
  });
  const hours = (totalMs / 3600000).toFixed(2);
  return openIn ? hours + " hrs (still clocked in)" : hours + " hrs";
}

    html += `<div class="emp-group"><div class="emp-header"><h3 class="emp-name">${escapeHtml(name)}</h3><span class="emp-hours">${computeHours(events)}</span></div>`;
    html += "<table><thead><tr><th>Action</th><th>Time</th><th>Location</th></tr></thead><tbody>";

      const t = r.timestamp ? r.timestamp.toDate().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "—";
